name: Build Linux Release and Publish

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  profile: minimal
                  override: true

            - name: Build (x86_64-unknown-linux-gnu)
              run: |
                  rustup target add x86_64-unknown-linux-gnu || true
                  cargo build --release --target x86_64-unknown-linux-gnu

            - name: Package binary
              run: |
                  mkdir -p release
                  BIN=target/x86_64-unknown-linux-gnu/release/obamify
                  if [ ! -f "$BIN" ]; then echo "Binary not found: $BIN"; exit 1; fi
                  cp "$BIN" release/obamify
                  tar -czf release/obamify-linux-x86_64.tar.gz -C release obamify

            - name: Create GitHub Release (if tag)
              if: ${{ startsWith(github.ref, 'refs/tags/') }}
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ github.ref_name }}
                  artifacts: release/obamify-linux-x86_64.tar.gz

            - name: Upload Release Artifact (workflow run)
              if: ${{ !startsWith(github.ref, 'refs/tags/') }}
              uses: actions/upload-artifact@v4
              with:
                  name: obamify-linux-x86_64
                  path: release/obamify-linux-x86_64.tar.gz

services:
  api:
    build:
      context: .
      target: runtime
    image: obamify-api:latest
    container_name: obamify-api
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - LISTEN_ADDR=0.0.0.0:3000
      - XDG_RUNTIME_DIR=/tmp/xdg_runtime
    tmpfs:
      - /tmp/xdg_runtime

  # 開發模式：挂載原始碼，在容器裡跨 cargo run
  api-dev:
    build:
      context: .
      target: builder
    image: obamify-api:dev
    container_name: obamify-api-dev
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo run --release -p obamify-api
    ports:
      - "3001:3000"
    environment:
      - RUST_LOG=debug
      - LISTEN_ADDR=0.0.0.0:3000
      - XDG_RUNTIME_DIR=/tmp/xdg_runtime
    tmpfs:
      - /tmp/xdg_runtime
    profiles:
      - dev

volumes:
  cargo-cache:

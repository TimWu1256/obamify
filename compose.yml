services:
  api:
    build:
      context: .
      target: runtime
    image: obamify-api:latest
    container_name: obamify-api
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - LISTEN_ADDR=0.0.0.0:3000
      - XDG_RUNTIME_DIR=/tmp/xdg_runtime
    tmpfs:
      - /tmp/xdg_runtime

[package]
name = "obamify-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "obamify-api"
path = "src/main.rs"

[dependencies]
obamify-core   = { path = "../core" }
obamify-render = { path = "../render" }
axum           = { version = "0.8", features = ["multipart"] }
tower-http     = { version = "0.6", features = ["cors", "trace"] }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = "1"
env_logger     = { workspace = true }
log            = { workspace = true }
bytes          = "1"
image          = { workspace = true }
uuid           = { version = "1.18.1", features = ["v4"] }

[features]
default = ["gif"]
gif     = []
